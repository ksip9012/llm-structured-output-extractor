[tools]
# 版の選び方: Python は最新の 1つ前のマイナー版。毎年 11月に見直す（decisions/0007）
python = "3.14"
uv = "0.13.6"

[env]
# uv が自分で Python を探さず、上の [tools] で mise が入れた Python を使うようにする
# （版を決める場所を mise.toml の 1か所にする）
UV_PYTHON_PREFERENCE = "only-system"

# 手元・pre-commit・CI で同じチェックを動かす（decisions/0003）
# ruff・pyright・pytest の版は uv.lock で固定する
[tasks.check]
description = "lint・format・型チェック・速いテスト"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run pyright",
  "uv run pytest -m 'not slow'",
]

[tasks.fix]
description = "lint の自動修正と format"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
]

# ライブラリと開発の道具を上げる。作業を始めるときに、本来の作業とは別のコミットで回す
# （よく触るリポジトリは月 1回まで。decisions/0008）
[tasks.upgrade]
description = "uv.lock のライブラリを、pyproject.toml の条件の中で最新にしてチェックする"
run = [
  "uv lock --upgrade",
  "mise run check",
]
