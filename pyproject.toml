[project]
name = "llm-structured-output-extractor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "google-genai>=2.25",
  "httpx>=0.28",
  "jsonschema>=4.26",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pyright",
  "pytest",
  "ruff",
]

[tool.uv]
# パッケージとして配らず、リポジトリの直下の llm_structured_output_extractor/ をそのまま使う
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "N",     # pep8-naming
  "RUF",   # Ruff
]
# docstring やコメントを日本語で書くので、全角の文字（（）、：など）を止めるルールは外す
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["llm_structured_output_extractor", "tests", "scripts", "conftest.py"]
exclude = ["**/__pycache__", "**/.venv"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 重いテスト（pre-commit と CI の check では動かさない）",
  "integration: 外部サービスに依存するテスト",
]
